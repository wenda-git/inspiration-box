{% extends "_layout.html" %}
{% block content %}
<div class="mb-6">
  <a href="/admin/inventory" class="text-sm text-ink-400 hover:text-ink-700">← 返回列表</a>
  <h1 class="text-3xl mt-2">{{ title }}</h1>
</div>

{% if error %}
  <div class="mb-6 rounded-lg bg-red-50 border border-red-500/20 px-4 py-3 text-red-600 text-sm">{{ error }}</div>
{% endif %}

<form method="post"
      action="{% if item and item.id %}/admin/inventory/{{ item.id }}/edit{% else %}/admin/inventory/new{% endif %}"
      class="space-y-6 max-w-5xl">

<section class="bg-white rounded-2xl p-6 space-y-4">
  <h2 class="text-lg">批次信息</h2>

  <div class="grid md:grid-cols-2 gap-4">
    <label class="block">
      <span class="block text-xs text-ink-400 mb-1">水果</span>
      <select name="fruit_code" required class="w-full rounded-lg border border-black/10 px-3 py-2">
        <option value="">-- 选择水果 --</option>
        {% for f in fruits %}
          <option value="{{ f.code }}"
            {% if item and item.fruit_code == f.code %}selected{% endif %}>
            {{ f.emoji }} {{ f.name_cn }}（{{ f.code }}）
          </option>
        {% endfor %}
      </select>
    </label>
    <label class="block">
      <span class="block text-xs text-ink-400 mb-1">批次号（唯一）</span>
      <input name="batch_no" required value="{{ item.batch_no if item else '' }}"
             class="w-full rounded-lg border border-black/10 px-3 py-2 font-mono">
    </label>
    <label class="block">
      <span class="block text-xs text-ink-400 mb-1">云仓编号</span>
      <input name="warehouse_code" value="{{ item.warehouse_code if item else 'WH-GZ' }}"
             class="w-full rounded-lg border border-black/10 px-3 py-2 font-mono">
    </label>
    <label class="block">
      <span class="block text-xs text-ink-400 mb-1">进货单价 (¥/kg)</span>
      <input name="unit_cost_cny_per_kg" type="number" step="0.01" min="0" required
             value="{{ item.unit_cost_cny_per_kg if item else '' }}"
             class="w-full rounded-lg border border-black/10 px-3 py-2 font-mono">
    </label>
  </div>

  <div class="grid md:grid-cols-2 gap-4">
    <label class="block">
      <span class="block text-xs text-ink-400 mb-1">总库存 (g)</span>
      <input name="qty_total_g" type="number" min="0" step="100" required
             value="{{ item.qty_total_g if item else '' }}"
             class="w-full rounded-lg border border-black/10 px-3 py-2 font-mono">
    </label>
    <label class="block">
      <span class="block text-xs text-ink-400 mb-1">可售库存 (g)</span>
      <input name="qty_avail_g" type="number" min="0" step="100"
             value="{{ item.qty_avail_g if item else '' }}"
             placeholder="留空 = 总库"
             class="w-full rounded-lg border border-black/10 px-3 py-2 font-mono">
    </label>
  </div>

  <div class="grid md:grid-cols-2 gap-4">
    <label class="block">
      <span class="block text-xs text-ink-400 mb-1">到货日</span>
      <input name="arrived_on" type="date" required
             value="{{ item.arrived_on if item else today }}"
             class="w-full rounded-lg border border-black/10 px-3 py-2 font-mono">
    </label>
    <label class="block">
      <span class="block text-xs text-ink-400 mb-1">保质期（最晚可卖）</span>
      <input name="best_before" type="date" required
             value="{{ item.best_before if item else default_best }}"
             class="w-full rounded-lg border border-black/10 px-3 py-2 font-mono">
    </label>
  </div>

  <div>
    <div class="text-sm text-ink-500 mb-2">品控指标</div>
    <div class="grid md:grid-cols-3 gap-4">
      <label class="block">
        <span class="block text-xs text-ink-400 mb-1">糖度</span>
        <input name="qc_brix" type="number" step="0.1" min="0"
               value="{{ item.qc_metrics.brix if item and item.qc_metrics else '' }}"
               class="w-full rounded-lg border border-black/10 px-3 py-2 font-mono">
      </label>
      <label class="block">
        <span class="block text-xs text-ink-400 mb-1">损坏率</span>
        <input name="qc_damage_rate" type="number" step="0.01" min="0" max="1"
               value="{{ item.qc_metrics.damage_rate if item and item.qc_metrics else '' }}"
               class="w-full rounded-lg border border-black/10 px-3 py-2 font-mono">
      </label>
      <label class="block">
        <span class="block text-xs text-ink-400 mb-1">果径 (mm)</span>
        <input name="qc_size_mm" type="number" step="1" min="0"
               value="{{ item.qc_metrics.size_mm if item and item.qc_metrics else '' }}"
               class="w-full rounded-lg border border-black/10 px-3 py-2 font-mono">
      </label>
    </div>
    <details class="mt-3">
      <summary class="cursor-pointer text-sm text-ink-500">高级品控字段</summary>
      <input name="qc_metrics_json"
             value='{{ item.qc_metrics_extra_json if item and item.qc_metrics_extra_json else "{}" }}'
             placeholder='例如 {"firmness": 8}'
             class="mt-2 w-full rounded-lg border border-black/10 px-3 py-2 font-mono text-sm">
    </details>
  </div>
</section>

<section class="bg-white rounded-2xl p-6">
  <label class="inline-flex items-center gap-3">
    <input type="checkbox" name="is_active"
           {% if item is none or item.is_active %}checked{% endif %}
           class="w-4 h-4 accent-matcha-500">
    <span>在售（可参与选品）</span>
  </label>
</section>

<div class="flex items-center gap-3">
  <button class="bg-ink-700 text-cream-50 px-6 py-2.5 rounded-full hover:bg-black">保存</button>
  <a href="/admin/inventory" class="text-ink-400 hover:text-ink-700">取消</a>
</div>

</form>
{% endblock %}
