<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title or '灵感果仓 后台' }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        matcha: { 50:'#F3F8F0', 500:'#6B9E5F', 600:'#5A8A4F' },
        berry:  { 50:'#F6F1FE', 500:'#8B5CF6' },
        peach:  { 50:'#FDF2EA', 500:'#F37C3C' },
        cream:  { 50:'#FAF6EF', 100:'#F3EDE1' },
        ink:    { 700:'#2B2420', 500:'#5B524C', 400:'#8F877F' },
      },
      fontFamily: {
        serif: ['"Noto Serif SC"','Songti SC','Georgia','serif'],
        sans:  ['-apple-system','"PingFang SC"','Helvetica Neue','sans-serif'],
      }
    }
  }
}
</script>
<style>
body { background: #FAF6EF; color: #2B2420; }
h1,h2,h3 { font-family: "Noto Serif SC","Songti SC",Georgia,serif; }
input, select, textarea, button { font: inherit; }
.admin-field {
  min-height: 2.5rem;
}
</style>
</head>
<body class="min-h-screen">

{% if request.state.admin_user %}
<header class="bg-white border-b border-black/5 sticky top-0 z-10">
  <div class="max-w-[1500px] mx-auto px-6 py-4 flex items-center justify-between gap-6">
    <a href="/admin" class="flex items-center gap-3 shrink-0">
      <span class="text-2xl">🥝</span>
      <span class="font-serif text-xl">灵感果仓 后台</span>
    </a>
    <nav class="flex items-center gap-6 text-sm whitespace-nowrap overflow-x-auto">
      <a href="/admin/fruits"    class="hover:text-matcha-500">水果主档</a>
      <a href="/admin/inventory" class="hover:text-matcha-500">库存管理</a>
      <a href="/admin/plans"     class="hover:text-matcha-500">箱型策略</a>
      <a href="/admin/orders"    class="hover:text-matcha-500">订单汇总</a>
      <span class="text-ink-400">·</span>
      <span class="text-ink-400">{{ request.state.admin_user }}</span>
      <form method="post" action="/admin/logout" class="inline">
        <button class="text-ink-400 hover:text-ink-700">退出</button>
      </form>
    </nav>
  </div>
</header>
{% endif %}

<main class="max-w-[1500px] mx-auto px-6 py-8">
  {% if flash %}
    <div class="mb-6 rounded-lg bg-matcha-50 border border-matcha-500/20 px-4 py-3 text-matcha-600">{{ flash }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</main>

</body>
</html>
